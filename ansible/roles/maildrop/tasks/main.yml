  - name: maildropdeployment
    kubernetes.core.k8s:
      kubeconfig: ~/.kube/config 
      namespace: "{{ NAMESPACE }}"
      template: deployment.yml.j2
    tags:
      - deployment

  - name: maildropsecret
    kubernetes.core.k8s:
      kubeconfig: ~/.kube/config
      namespace: "{{ NAMESPACE }}"
      template: onepassword.yml.j2
    tags:
      - 1password

  - name: Add maildrop default allow network policy
    kubernetes.core.k8s:
      kubeconfig: ~/.kube/config
      namespace: "{{ NAMESPACE }}"
      template: default-allow-networkpolicy.yml.j2
    tags:
      - networkPolicy
